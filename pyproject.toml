[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prefix-python"
version = "0.1.0"
description = "Deterministic Python prefix layer for bounded correctness."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary - Fast Industries" }
authors = [
  { name = "Fast Industries" }
]
keywords = ["python", "deterministic", "prefix-layer", "syntax", "vscode"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Software Development :: Quality Assurance"
]

[project.scripts]
prefix-python = "prefix_python.cli:main"
prefix-python-ops = "prefix_python.commercial_operator_console:main"

[project.urls]
Homepage = "https://fast-industries-prefix.steven-k-ratushniak.chatgpt.site/prefix/"
Documentation = "https://fast-industries-prefix.steven-k-ratushniak.chatgpt.site/prefix/install/"
Repository = "https://github.com/stevenkratushniak-ctrl/PREFIX-for-Python"
Issues = "https://github.com/stevenkratushniak-ctrl/PREFIX-for-Python/issues"
Purchase = "https://fastlaunch.lemonsqueezy.com/checkout/buy/37f6bf48-4f0d-4151-a076-8b60f030e985"

[tool.setuptools]
packages = ["prefix_python"]
